[project]
name = "hexhex"
version = "0.1.0"
description = "Reinforcement learning agent for the board game Hex"
readme = "readme.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.9", # New ONNX exporter (dynamo) is the default from 2.9.
    "numpy",
    "pygame",
    "tensorboard",
    "hydra-core>=1.3.0",
    "matplotlib",
    "jupyter",
    "image",
    "future",
    "scikit-learn",
    "setuptools<70", # Old version for tensorboard to work.
    "onnx>=1.19.0",
    "onnxscript", # Required by torch's ONNX exporter.
    "onnxruntime", # Runs uploaded candidates in the referee service (hexhex/referee).
    "ml-dtypes>=0.4.1", # This version is needed for onnx to work properly.
    "modal>=1.4.2", # For execution on rented GPUs
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hexhex*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
